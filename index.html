<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>REDEX JUMP</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050507;
    touch-action:none;
    font-family:Arial,sans-serif;
}

button{
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
    outline:none;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* ================= MENU ================= */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at 50% 35%,#41105f,#120918 45%,#050407 100%);
}

.logo{
    color:#c878ff;
    font-size:clamp(48px,11vw,90px);
    line-height:.85;
    font-weight:1000;
    letter-spacing:7px;
    text-shadow:
        0 0 15px #9d39d4,
        0 0 45px #65148b;
}

.logo span{
    color:#fff;
}

.subtitle{
    margin-top:25px;
    color:#aaa;
    letter-spacing:4px;
    font-size:13px;
}

#play{
    margin-top:40px;
    width:230px;
    height:68px;
    border-radius:20px;
    border:2px solid #c477ff;
    color:white;
    background:linear-gradient(135deg,#792ca2,#351044);
    font-size:24px;
    font-weight:900;
    letter-spacing:4px;
    box-shadow:0 0 35px rgba(180,80,240,.3);
}

#play:active{
    transform:scale(.94);
}

.best{
    margin-top:25px;
    color:#888;
}

.best b{
    color:#d18bff;
}

/* ================= GAME ================= */

#game{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    z-index:10;
    top:14px;
    left:14px;
    right:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

.info{
    min-width:90px;
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:13px;
    background:rgba(5,5,9,.7);
    backdrop-filter:blur(8px);
}

.info small{
    display:block;
    color:#777;
    font-size:9px;
    letter-spacing:2px;
}

.info strong{
    color:#fff;
    font-size:18px;
}

#pause{
    pointer-events:auto;
    width:45px;
    height:42px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
    background:rgba(0,0,0,.55);
}

/* ================= CONTROLS ================= */

#controls{
    position:absolute;
    z-index:20;
    bottom:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:end;
    pointer-events:none;
}

.left-controls{
    display:flex;
    gap:12px;
}

.control{
    width:70px;
    height:70px;
    border-radius:20px;
    border:2px solid rgba(255,255,255,.2);
    background:rgba(12,8,16,.85);
    color:#fff;
    font-size:27px;
    pointer-events:auto;
}

.control:active{
    transform:scale(.91);
}

.jump{
    width:84px;
    height:84px;
    border-radius:50%;
    background:linear-gradient(145deg,#8b35b5,#431450);
    border-color:#d084ff;
}

/* ================= RESULT ================= */

#result{
    position:absolute;
    z-index:50;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
}

.result-box{
    width:min(430px,90%);
    padding:35px;
    text-align:center;
    border-radius:25px;
    background:#120d17;
    border:1px solid #714381;
}

.result-box h2{
    color:#d58cff;
    font-size:34px;
}

.result-box p{
    margin-top:12px;
    color:#aaa;
}

.result-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.result-actions button{
    padding:13px 18px;
    border-radius:11px;
    border:1px solid #75478b;
    background:#29152f;
    color:#fff;
}

.hidden{
    display:none!important;
}

/* ================= PORTRAIT ================= */

#rotate{
    display:none;
}

@media(max-width:800px) and (orientation:portrait){
    #rotate{
        position:absolute;
        inset:0;
        z-index:999;
        display:flex;
        align-items:center;
        justify-content:center;
        text-align:center;
        color:#fff;
        background:#070508;
        font-size:22px;
        font-weight:bold;
    }
}

@media(max-width:600px){

    .control{
        width:62px;
        height:62px;
    }

    .jump{
        width:76px;
        height:76px;
    }

    .info{
        min-width:70px;
        padding:7px 9px;
    }

    .info strong{
        font-size:15px;
    }
}
</style>
</head>

<body>

<div id="app">

<!-- ================= MENU ================= -->

<div id="menu">

    <div>

        <div class="logo">
            REDEX<br>
            <span>JUMP</span>
        </div>

        <div class="subtitle">
            RUN • JUMP • ENTER THE DOOR
        </div>

        <button id="play">
            PLAY
        </button>

        <div class="best">
            BEST SCORE:
            <b id="best">0</b>
        </div>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="info">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="info">
            <small>LEVEL</small>
            <strong id="level">1 / 5</strong>
        </div>

        <div class="info">
            <small>HEARTS</small>
            <strong id="hearts">❤️❤️❤️</strong>
        </div>

        <button id="pause">Ⅱ</button>

    </div>


    <div id="controls">

        <div class="left-controls">

            <button class="control" id="left">◀</button>

            <button class="control" id="right">▶</button>

        </div>

        <button class="control jump" id="jump">▲</button>

    </div>


    <!-- RESULT -->

    <div id="result">

        <div class="result-box">

            <h2 id="resultTitle">
                LEVEL COMPLETE
            </h2>

            <p id="resultText">
                Score: 0
            </p>

            <div class="result-actions">

                <button id="next">
                    NEXT LEVEL
                </button>

                <button id="retry">
                    RESTART
                </button>

            </div>

        </div>

    </div>

</div>


<div id="rotate">
    📱<br><br>
    اقلب الهاتف بالعرض<br>
    للعب REDEX JUMP
</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;

}

addEventListener("resize",resize);
resize();


/* =====================================================
   DOM
===================================================== */

const menu=document.getElementById("menu");
const game=document.getElementById("game");

const play=document.getElementById("play");

const scoreText=document.getElementById("score");
const levelText=document.getElementById("level");
const heartsText=document.getElementById("hearts");
const bestText=document.getElementById("best");

const result=document.getElementById("result");
const resultTitle=document.getElementById("resultTitle");
const resultText=document.getElementById("resultText");

const nextButton=document.getElementById("next");
const retryButton=document.getElementById("retry");

const pauseButton=document.getElementById("pause");


/* =====================================================
   GAME STATE
===================================================== */

let level=1;
let score=0;
let hearts=3;

let running=false;
let paused=false;

let cameraX=0;

let platforms=[];
let spikes=[];
let saws=[];
let coins=[];
let particles=[];

let door=null;


/* =====================================================
   LEVEL THEMES
===================================================== */

const themes={

    1:{
        sky1:"#16091f",
        sky2:"#07040b",
        platform:"#21152b",
        top:"#b54cff",
        accent:"#c86cff",
        door:"#bb4cff",
        doorGlow:"#9b27ff",
        lava:"#e52d75",
        name:"PURPLE CITY"
    },

    2:{
        sky1:"#071b2b",
        sky2:"#031015",
        platform:"#102734",
        top:"#21d4e8",
        accent:"#32efff",
        door:"#18d9e9",
        doorGlow:"#00a9ff",
        lava:"#ff684d",
        name:"CYBER OCEAN"
    },

    3:{
        sky1:"#281205",
        sky2:"#0d0502",
        platform:"#382010",
        top:"#ff9f2f",
        accent:"#ffd35a",
        door:"#ff982d",
        doorGlow:"#ff5100",
        lava:"#ff3b16",
        name:"BURNING WORLD"
    },

    4:{
        sky1:"#071d16",
        sky2:"#030b09",
        platform:"#102c23",
        top:"#35e69b",
        accent:"#68ffb7",
        door:"#28df91",
        doorGlow:"#00b86b",
        lava:"#d7ff49",
        name:"JUNGLE CORE"
    },

    5:{
        sky1:"#18072b",
        sky2:"#04030a",
        platform:"#251039",
        top:"#ff4dbb",
        accent:"#ff80d1",
        door:"#ff43b5",
        doorGlow:"#c40079",
        lava:"#ff245e",
        name:"FINAL DIMENSION"
    }

};


/* =====================================================
   PLAYER
===================================================== */

const player={

    x:100,
    y:100,

    w:30,
    h:46,

    vx:0,
    vy:0,

    speed:6.2,
    acceleration:.75,

    gravity:.65,

    jumpPower:-13,

    grounded:false,

    coyote:0,
    jumpBuffer:0,

    facing:1,

    startX:100,
    startY:100

};


/* =====================================================
   INPUT
===================================================== */

const keys={
    left:false,
    right:false
};


function jump(){

    player.jumpBuffer=8;

}


addEventListener("keydown",e=>{

    if(
        e.key==="ArrowLeft"||
        e.key.toLowerCase()==="a"
    ){

        keys.left=true;
        player.facing=-1;

    }

    if(
        e.key==="ArrowRight"||
        e.key.toLowerCase()==="d"
    ){

        keys.right=true;
        player.facing=1;

    }

    if(
        e.key===" "||
        e.key==="ArrowUp"||
        e.key.toLowerCase()==="w"
    ){

        jump();
        e.preventDefault();

    }

});


addEventListener("keyup",e=>{

    if(
        e.key==="ArrowLeft"||
        e.key.toLowerCase()==="a"
    ){

        keys.left=false;

    }

    if(
        e.key==="ArrowRight"||
        e.key.toLowerCase()==="d"
    ){

        keys.right=false;

    }

});


/* =====================================================
   MOBILE INPUT
===================================================== */

function buttonHold(element,down,up){

    element.addEventListener("pointerdown",e=>{

        e.preventDefault();

        try{
            element.setPointerCapture(e.pointerId);
        }catch(_){}

        down();

    });

    element.addEventListener("pointerup",e=>{

        e.preventDefault();

        up();

    });

    element.addEventListener("pointercancel",up);

}


buttonHold(
    document.getElementById("left"),
    ()=>{
        keys.left=true;
        player.facing=-1;
    },
    ()=>{
        keys.left=false;
    }
);


buttonHold(
    document.getElementById("right"),
    ()=>{
        keys.right=true;
        player.facing=1;
    },
    ()=>{
        keys.right=false;
    }
);


document.getElementById("jump")
.addEventListener("pointerdown",e=>{

    e.preventDefault();

    jump();

});


/* منع النسخ والتحديد نهائيا على أزرار اللعب */

document.addEventListener("contextmenu",e=>{

    if(e.target.closest("#controls"))
        e.preventDefault();

});

document.addEventListener("selectstart",e=>{

    if(e.target.closest("#controls"))
        e.preventDefault();

});

document.addEventListener("dragstart",e=>{

    if(e.target.closest("#controls"))
        e.preventDefault();

});


/* =====================================================
   START GAME
===================================================== */

play.addEventListener("click",()=>{

    menu.style.display="none";
    game.style.display="block";

    level=1;
    score=0;
    hearts=3;

    loadLevel();

});


/* =====================================================
   CREATE LEVEL
===================================================== */

function loadLevel(){

    running=true;
    paused=false;

    platforms=[];
    spikes=[];
    saws=[];
    coins=[];
    particles=[];

    cameraX=0;

    const ground=H-90;

    /* البداية */

    addPlatform(
        0,
        ground,
        500,
        28
    );


    let x=560;
    let y=ground-65;


    const count=
        17+
        level*4;


    for(let i=0;i<count;i++){

        const width=
            Math.max(
                95,
                185-level*12-
                Math.random()*35
            );


        y +=
            (Math.random()-.5)*
            (55+level*8);


        y=Math.max(
            H-350,
            Math.min(
                ground-30,
                y
            )
        );


        addPlatform(
            x,
            y,
            width,
            26
        );


        /* مسامير */

        if(
            i>1 &&
            Math.random()<
            .20+level*.055
        ){

            const sw=
                28+
                Math.random()*35;


            spikes.push({

                x:
                    x+
                    Math.random()*
                    Math.max(
                        1,
                        width-sw
                    ),

                y:y-22,

                w:sw,
                h:22

            });

        }


        /* مناشير */

        if(
            i>4 &&
            Math.random()<
            .08+level*.035
        ){

            saws.push({

                baseX:
                    x+width/2,

                x:
                    x+width/2,

                y:y-65,

                radius:18,

                time:
                    Math.random()*10,

                speed:
                    .025+
                    level*.004,

                range:
                    35+
                    level*10

            });

        }


        /* عملة */

        if(Math.random()<.75){

            coins.push({

                x:x+width/2,

                y:y-48,

                r:8,

                collected:false

            });

        }


        x +=
            width+
            130+
            level*12+
            Math.random()*65;

    }


    /* منصة النهاية */

    addPlatform(
        x,
        ground-30,
        430,
        30
    );


    /* الباب */

    door={

        x:x+250,

        y:ground-145,

        w:65,

        h:115,

        pulse:0

    };


    /* نقطة البداية */

    player.startX=100;
    player.startY=ground-100;

    player.x=player.startX;
    player.y=player.startY;

    player.vx=0;
    player.vy=0;

    updateUI();

}


/* =====================================================
   PLATFORM
===================================================== */

function addPlatform(x,y,w,h){

    platforms.push({
        x,
        y,
        w,
        h
    });

}


/* =====================================================
   COLLISION
===================================================== */

function collide(a,b){

    return(
        a.x<b.x+b.w &&
        a.x+a.w>b.x &&
        a.y<b.y+b.h &&
        a.y+a.h>b.y
    );

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!running||paused)
        return;


    const theme=themes[level];


    /* Jump buffer */

    if(player.jumpBuffer>0)
        player.jumpBuffer--;


    /* حركة */

    if(keys.left){

        player.vx-=
            player.acceleration;

    }

    if(keys.right){

        player.vx+=
            player.acceleration;

    }


    if(!keys.left&&!keys.right){

        player.vx*=.80;

    }


    player.vx=
        Math.max(
            -player.speed,
            Math.min(
                player.speed,
                player.vx
            )
        );


    player.x+=player.vx;


    /* جاذبية */

    player.vy+=player.gravity;

    player.y+=player.vy;


    player.grounded=false;


    /* المنصات */

    for(const p of platforms){

        const oldBottom=
            player.y+
            player.h-
            player.vy;

        const bottom=
            player.y+
            player.h;


        if(

            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            oldBottom<=p.y &&
            bottom>=p.y &&
            player.vy>=0

        ){

            player.y=
                p.y-player.h;

            player.vy=0;

            player.grounded=true;

            player.coyote=7;

        }

    }


    if(!player.grounded){

        if(player.coyote>0)
            player.coyote--;

    }


    /* Jump */

    if(
        player.jumpBuffer>0 &&
        (
            player.grounded||
            player.coyote>0
        )
    ){

        player.vy=
            player.jumpPower;

        player.jumpBuffer=0;

        player.grounded=false;

        particlesBurst(
            player.x+15,
            player.y+46,
            8,
            theme.accent
        );

    }


    /* Spikes */

    for(const s of spikes){

        if(collide(player,s)){

            loseHeart();

            return;

        }

    }


    /* Saws */

    for(const saw of saws){

        saw.time+=saw.speed;

        saw.x=
            saw.baseX+
            Math.sin(saw.time)*
            saw.range;


        const closestX=
            Math.max(
                player.x,
                Math.min(
                    saw.x,
                    player.x+player.w
                )
            );


        const closestY=
            Math.max(
                player.y,
                Math.min(
                    saw.y,
                    player.y+player.h
                )
            );


        const dx=
            saw.x-closestX;

        const dy=
            saw.y-closestY;


        if(
            dx*dx+
            dy*dy
            <
            saw.radius*saw.radius
        ){

            loseHeart();

            return;

        }

    }


    /* Coins */

    for(const coin of coins){

        if(coin.collected)
            continue;


        const dx=
            player.x+15-
            coin.x;

        const dy=
            player.y+20-
            coin.y;


        if(
            Math.sqrt(dx*dx+dy*dy)
            <28
        ){

            coin.collected=true;

            score+=150;

            particlesBurst(
                coin.x,
                coin.y,
                14,
                theme.accent
            );

        }

    }


    /* الباب */

    door.pulse+=.05;


    const doorHit={

        x:door.x+8,
        y:door.y,
        w:door.w-16,
        h:door.h

    };


    if(collide(player,doorHit)){

        finishLevel();

        return;

    }


    /* سقوط */

    if(player.y>H+180){

        loseHeart();

        return;

    }


    /* نقاط الحركة */

    score+=
        Math.floor(
            Math.abs(player.vx)*.04
        );


    /* الكاميرا */

    const target=
        player.x-W*.35;


    cameraX +=
        (target-cameraX)*.09;


    cameraX=
        Math.max(
            0,
            cameraX
        );


    updateParticles();

    updateUI();

}


/* =====================================================
   LOSE HEART
===================================================== */

function loseHeart(){

    hearts--;

    updateUI();


    const theme=themes[level];


    particlesBurst(
        player.x+15,
        player.y+20,
        25,
        theme.accent
    );


    if(hearts<=0){

        running=false;

        saveBest();


        showResult(
            "GAME OVER",
            "انتهت القلوب • SCORE: "+Math.floor(score),
            false
        );

        return;

    }


    /*
       مهم:
       العودة لبداية المرحلة نفسها
       وليس إلى Checkpoint
    */

    player.x=player.startX;
    player.y=player.startY;

    player.vx=0;
    player.vy=0;

    cameraX=0;

}


/* =====================================================
   FINISH LEVEL
===================================================== */

function finishLevel(){

    running=false;

    score+=1000*level;

    saveBest();


    if(level<5){

        showResult(
            "🚪 LEVEL "+level+" COMPLETE",
            "دخلت الباب! استعد للمرحلة التالية.",
            true
        );

    }else{

        showResult(
            "🏆 REDEX MASTER",
            "أنهيت المراحل الخمس! SCORE: "+Math.floor(score),
            false
        );

    }

}


/* =====================================================
   RESULT
===================================================== */

function showResult(title,text,canNext){

    result.style.display="flex";

    resultTitle.textContent=title;

    resultText.textContent=text;

    nextButton.classList.toggle(
        "hidden",
        !canNext
    );

}


/* =====================================================
   NEXT
===================================================== */

nextButton.addEventListener("click",()=>{

    result.style.display="none";

    level++;

    /*
       القلوب لا تعود للصفر،
       حتى تبقى المرحلة التالية
       أكثر تحديًا.
    */

    loadLevel();

});


/* =====================================================
   RETRY
===================================================== */

retryButton.addEventListener("click",()=>{

    result.style.display="none";

    level=1;
    score=0;
    hearts=3;

    loadLevel();

});


/* =====================================================
   PAUSE
===================================================== */

pauseButton.addEventListener("click",()=>{

    if(!running)
        return;

    paused=!paused;

    pauseButton.textContent=
        paused?"▶":"Ⅱ";

});


/* =====================================================
   PARTICLES
===================================================== */

function particlesBurst(x,y,count,color){

    for(let i=0;i<count;i++){

        particles.push({

            x,
            y,

            vx:
                (Math.random()-.5)*6,

            vy:
                (Math.random()-.5)*6,

            life:
                25+
                Math.random()*25,

            size:
                2+
                Math.random()*4,

            color

        });

    }

}


function updateParticles(){

    for(const p of particles){

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.08;

        p.life--;

    }


    particles=
        particles.filter(
            p=>p.life>0
        );

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    const t=themes[level];


    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        t.sky1
    );

    gradient.addColorStop(
        1,
        t.sky2
    );


    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* ضوء الخلفية */

    ctx.globalAlpha=.13;

    ctx.fillStyle=t.accent;

    ctx.beginPath();

    ctx.arc(
        W*.75,
        H*.22,
        90,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;


    /* نجوم */

    for(let i=0;i<50;i++){

        const x=
            (
                i*183-
                cameraX*.12
            )%
            (W+200);

        const y=
            35+
            (i*71)%
            (H*.55);


        ctx.fillStyle=
            "rgba(255,255,255,.35)";

        ctx.fillRect(
            x,
            y,
            2,
            2
        );

    }


    /* مباني */

    ctx.fillStyle=
        "rgba(0,0,0,.25)";


    for(let i=0;i<15;i++){

        const x=
            i*160-
            cameraX*.18;

        const height=
            70+
            (i*37)%130;


        ctx.fillRect(
            x,
            H-85-height,
            120,
            height
        );

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    drawBackground();

    const t=themes[level];


    /* ================= PLATFORMS ================= */

    for(const p of platforms){

        const x=
            p.x-cameraX;


        if(x+p.w<0||x>W)
            continue;


        ctx.fillStyle=
            "rgba(0,0,0,.4)";

        ctx.fillRect(
            x+5,
            p.y+7,
            p.w,
            p.h
        );


        ctx.fillStyle=
            t.platform;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );


        ctx.fillStyle=
            t.top;

        ctx.fillRect(
            x,
            p.y,
            p.w,
            4
        );

    }


    /* ================= SPIKES ================= */

    for(const s of spikes){

        const x=
            s.x-cameraX;


        ctx.fillStyle="#eee";


        const count=
            Math.max(
                2,
                Math.floor(s.w/11)
            );


        const width=
            s.w/count;


        for(let i=0;i<count;i++){

            ctx.beginPath();

            ctx.moveTo(
                x+i*width,
                s.y+s.h
            );

            ctx.lineTo(
                x+i*width+width/2,
                s.y
            );

            ctx.lineTo(
                x+(i+1)*width,
                s.y+s.h
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* ================= SAWS ================= */

    for(const saw of saws){

        const x=
            saw.x-cameraX;


        ctx.save();

        ctx.translate(
            x,
            saw.y
        );


        ctx.rotate(
            saw.time*3
        );


        ctx.fillStyle="#dfe5ea";


        const teeth=10;


        for(let i=0;i<teeth;i++){

            ctx.rotate(
                Math.PI*2/teeth
            );

            ctx.beginPath();

            ctx.moveTo(
                0,
                -saw.radius-7
            );

            ctx.lineTo(
                7,
                -saw.radius+4
            );

            ctx.lineTo(
                -7,
                -saw.radius+4
            );

            ctx.closePath();

            ctx.fill();

        }


        ctx.beginPath();

        ctx.arc(
            0,
            0,
            saw.radius-5,
            0,
            Math.PI*2
        );

        ctx.fillStyle="#555";

        ctx.fill();


        ctx.restore();

    }


    /* ================= COINS ================= */

    for(const c of coins){

        if(c.collected)
            continue;


        const x=
            c.x-cameraX;


        ctx.fillStyle=t.accent;

        ctx.beginPath();

        ctx.arc(
            x,
            c.y,
            c.r,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            x-2,
            c.y-3,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* ================= DOOR ================= */

    drawDoor(t);


    /* ================= PLAYER ================= */

    drawPlayer(t);


    /* ================= PARTICLES ================= */

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/45
            );

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   DRAW DOOR
===================================================== */

function drawDoor(t){

    const x=
        door.x-cameraX;


    if(x+door.w<0||x>W)
        return;


    const glow=
        12+
        Math.sin(door.pulse)*5;


    /* Glow */

    ctx.save();

    ctx.shadowBlur=30+glow;

    ctx.shadowColor=t.doorGlow;

    ctx.fillStyle=t.door;

    ctx.fillRect(
        x,
        door.y,
        door.w,
        door.h
    );

    ctx.restore();


    /* جسم الباب */

    ctx.fillStyle=
        "rgba(15,5,20,.88)";

    ctx.fillRect(
        x+7,
        door.y+7,
        door.w-14,
        door.h-7
    );


    /* الإطار */

    ctx.strokeStyle=t.door;

    ctx.lineWidth=5;

    ctx.strokeRect(
        x,
        door.y,
        door.w,
        door.h
    );


    /* مقبض */

    ctx.fillStyle=t.accent;

    ctx.beginPath();

    ctx.arc(
        x+door.w-17,
        door.y+door.h/2,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* السهم */

    ctx.fillStyle="#fff";

    ctx.font="bold 18px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "ENTER",
        x+door.w/2,
        door.y-13
    );

}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(t){

    const x=
        player.x-cameraX;


    /* ظل */

    ctx.fillStyle=
        "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
        x+15,
        player.y+50,
        19,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* أثر الحركة */

    if(Math.abs(player.vx)>3){

        ctx.globalAlpha=.18;

        ctx.fillStyle=t.accent;

        ctx.fillRect(
            x-player.vx*2,
            player.y+8,
            30,
            38
        );

        ctx.globalAlpha=1;

    }


    /* الجسم */

    ctx.fillStyle="#320745";

    ctx.fillRect(
        x,
        player.y,
        30,
        46
    );


    /* حدود */

    ctx.strokeStyle=t.accent;

    ctx.lineWidth=1.5;

    ctx.strokeRect(
        x,
        player.y,
        30,
        46
    );


    /* الرأس */

    ctx.fillStyle="#3f0756";

    ctx.beginPath();

    ctx.arc(
        x+15,
        player.y-8,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* العين */

    ctx.fillStyle="#fff";


    const eye=
        player.facing>0
        ?x+21
        :x+6;


    ctx.fillRect(
        eye,
        player.y-11,
        3,
        3
    );

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    scoreText.textContent=
        Math.floor(score);

    levelText.textContent=
        level+" / 5";

    heartsText.textContent=
        "❤️".repeat(
            Math.max(0,hearts)
        );

}


/* =====================================================
   BEST SCORE
===================================================== */

function saveBest(){

    const old=
        Number(
            bestText.textContent
        )||0;


    if(score>old){

        bestText.textContent=
            Math.floor(score);

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}


loop();

</script>
