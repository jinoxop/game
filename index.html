<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>REDEX JUMP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    overflow:hidden;
    background:#07060b;
    font-family:Arial,sans-serif;
    color:white;
}

/* ================= MENU ================= */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 35%,#321451 0%,#110b18 35%,#050509 80%);
}

.menuBox{
    width:min(500px,90%);
    text-align:center;
}

.logo{
    font-size:clamp(42px,10vw,80px);
    font-weight:900;
    letter-spacing:8px;
    color:#b45cff;
    text-shadow:
        0 0 10px #8c2cff,
        0 0 35px #6614aa;
}

.subtitle{
    margin-top:10px;
    color:#aaa;
    letter-spacing:3px;
}

.playBtn{
    margin-top:45px;
    width:220px;
    height:65px;
    border:2px solid #b45cff;
    border-radius:18px;
    background:linear-gradient(135deg,#6821a0,#35104e);
    color:white;
    font-size:25px;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
    box-shadow:0 0 25px #5e1590;
    transition:.2s;
}

.playBtn:hover{
    transform:scale(1.06);
}

.best{
    margin-top:25px;
    color:#888;
}

/* ================= GAME ================= */

#game{
    display:none;
    position:absolute;
    inset:0;
    background:#08070d;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
    z-index:10;
}

.hudBox{
    padding:10px 16px;
    border:1px solid #56306e;
    border-radius:12px;
    background:rgba(9,7,14,.75);
    backdrop-filter:blur(8px);
}

.hudTitle{
    color:#aaa;
    font-size:11px;
}

.hudValue{
    color:#d28aff;
    font-size:20px;
    font-weight:bold;
}

/* ================= CONTROLS ================= */

#controls{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    display:flex;
    justify-content:space-between;
    padding:0 25px;
    z-index:20;
    pointer-events:none;
}

.leftControls{
    display:flex;
    gap:12px;
}

.control{
    width:75px;
    height:75px;
    border-radius:20px;
    border:2px solid #63367c;
    background:rgba(20,12,27,.82);
    color:white;
    font-size:28px;
    font-weight:bold;
    pointer-events:auto;
    touch-action:none;
    user-select:none;
}

.control:active{
    background:#8d3bc0;
    transform:scale(.94);
}

.jump{
    width:90px;
    height:90px;
    border-radius:50%;
    background:rgba(95,28,130,.85);
    border-color:#c16cff;
}

/* ================= PAUSE ================= */

#pauseBtn{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:15;
    padding:9px 18px;
    border:1px solid #59326c;
    background:rgba(8,6,12,.8);
    color:white;
    border-radius:10px;
}

/* ================= RESULT ================= */

#result{
    display:none;
    position:absolute;
    inset:0;
    z-index:30;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.78);
}

.resultBox{
    width:min(420px,90%);
    padding:35px;
    border:1px solid #763e94;
    border-radius:22px;
    background:#120d19;
    text-align:center;
    box-shadow:0 0 50px rgba(130,35,180,.25);
}

.resultBox h2{
    color:#c777ff;
    font-size:38px;
}

.resultBox p{
    margin-top:15px;
    color:#aaa;
}

.resultButtons{
    margin-top:25px;
    display:flex;
    gap:10px;
    justify-content:center;
}

.resultButtons button{
    padding:12px 20px;
    border-radius:10px;
    border:1px solid #713e89;
    background:#29152f;
    color:white;
    cursor:pointer;
}

/* ================= MOBILE LANDSCAPE ================= */

@media(max-width:800px) and (orientation:portrait){

    #game::after{
        content:"↻ اقلب الهاتف للعرض";
        position:absolute;
        inset:0;
        z-index:100;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#08070d;
        color:white;
        font-size:24px;
        font-weight:bold;
    }
}

@media(max-width:700px){

    .control{
        width:62px;
        height:62px;
    }

    .jump{
        width:78px;
        height:78px;
    }

    #controls{
        padding:0 15px;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">
            REDEX<br>JUMP
        </div>

        <div class="subtitle">
            2D PARKOUR • RUN • JUMP
        </div>

        <button class="playBtn" id="playBtn">
            PLAY
        </button>

        <div class="best">
            BEST SCORE:
            <span id="bestScore">0</span>
        </div>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <div id="hud">

        <div class="hudBox">
            <div class="hudTitle">SCORE</div>
            <div class="hudValue" id="score">0</div>
        </div>

        <div class="hudBox">
            <div class="hudTitle">LEVEL</div>
            <div class="hudValue" id="level">1 / 5</div>
        </div>

        <div class="hudBox">
            <div class="hudTitle">COINS</div>
            <div class="hudValue" id="coins">0</div>
        </div>

    </div>

    <button id="pauseBtn">Ⅱ</button>


    <!-- CONTROLS -->

    <div id="controls">

        <div class="leftControls">

            <button class="control" id="left">
                ◀
            </button>

            <button class="control" id="right">
                ▶
            </button>

        </div>

        <button class="control jump" id="jump">
            ▲
        </button>

    </div>


    <!-- RESULT -->

    <div id="result">

        <div class="resultBox">

            <h2 id="resultTitle">
                LEVEL COMPLETE
            </h2>

            <p id="resultText">
                Score: 0
            </p>

            <div class="resultButtons">

                <button id="nextBtn">
                    NEXT LEVEL
                </button>

                <button id="restartBtn">
                    RESTART
                </button>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   REDEX JUMP
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const menu =
    document.getElementById("menu");

const game =
    document.getElementById("game");

const playBtn =
    document.getElementById("playBtn");

const result =
    document.getElementById("result");

const scoreUI =
    document.getElementById("score");

const levelUI =
    document.getElementById("level");

const coinsUI =
    document.getElementById("coins");

const bestUI =
    document.getElementById("bestScore");


/* =========================
   GAME STATE
========================= */

let W = 0;
let H = 0;

let running = false;
let paused = false;

let currentLevel = 1;

let score = 0;
let coins = 0;

let cameraX = 0;

let platforms = [];
let traps = [];
let collectibles = [];

let levelLength = 3000;

let keys = {
    left:false,
    right:false
};


/* =========================
   PLAYER
========================= */

const player = {

    x:100,
    y:100,

    width:30,
    height:48,

    vx:0,
    vy:0,

    speed:5.2,

    jumpPower:13,

    grounded:false

};


/* =========================
   CANVAS
========================= */

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

}

window.addEventListener("resize",resize);

resize();


/* =========================
   LEVEL DATA
========================= */

const levelDifficulty = {

    1:{
        gap:170,
        trapChance:.08,
        platformCount:16
    },

    2:{
        gap:200,
        trapChance:.15,
        platformCount:19
    },

    3:{
        gap:230,
        trapChance:.23,
        platformCount:23
    },

    4:{
        gap:260,
        trapChance:.32,
        platformCount:27
    },

    5:{
        gap:290,
        trapChance:.42,
        platformCount:32
    }

};


/* =========================
   START GAME
========================= */

playBtn.addEventListener("click",()=>{

    menu.style.display="none";

    game.style.display="block";

    currentLevel=1;

    score=0;

    coins=0;

    startLevel();

});


/* =========================
   START LEVEL
========================= */

function startLevel(){

    result.style.display="none";

    paused=false;

    running=true;

    cameraX=0;

    platforms=[];
    traps=[];
    collectibles=[];

    player.x=100;
    player.y=100;

    player.vx=0;
    player.vy=0;

    createLevel();

    updateUI();

}


/* =========================
   CREATE LEVEL
========================= */

function createLevel(){

    const difficulty =
        levelDifficulty[currentLevel];

    const groundY =
        H-90;

    /* البداية */

    platforms.push({

        x:0,
        y:groundY,
        width:430,
        height:100

    });


    let x=500;

    let lastY=groundY-70;


    for(
        let i=0;
        i<difficulty.platformCount;
        i++
    ){

        const width =
            Math.max(
                95,
                190-currentLevel*12
            );


        /* اختلاف الارتفاع */

        let direction =
            Math.random()>.5 ? -1 : 1;

        let heightChange =
            direction *
            (40+Math.random()*100);


        lastY += heightChange;


        /* لا تجعل المنصة خارج الشاشة */

        lastY =
            Math.max(
                H-360,
                Math.min(
                    H-80,
                    lastY
                )
            );


        platforms.push({

            x:x,
            y:lastY,
            width:width,
            height:25

        });


        /* فخ */

        if(
            i>1 &&
            Math.random()<
            difficulty.trapChance
        ){

            traps.push({

                x:
                    x+
                    width/2-
                    18,

                y:
                    lastY-20,

                width:36,

                height:20,

                type:
                    Math.random()>.5
                    ?"spike"
                    :"lava"

            });

        }


        /* عملة */

        if(Math.random()>.3){

            collectibles.push({

                x:
                    x+
                    width/2,

                y:
                    lastY-45,

                r:8,

                taken:false

            });

        }


        x +=
            width+
            difficulty.gap+
            Math.random()*100;

    }


    /* منصة النهاية */

    platforms.push({

        x:x,

        y:H-180,

        width:300,

        height:30

    });


    levelLength =
        x+300;


    /* بوابة النهاية */

    traps.push({

        x:x+260,
        y:H-250,
        width:5,
        height:70,
        type:"finish"

    });

}


/* =========================
   INPUT
========================= */

window.addEventListener("keydown",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        keys.left=true;

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        keys.right=true;

    if(
        e.key===" " ||
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w"
    ){

        jump();

        e.preventDefault();

    }

});


window.addEventListener("keyup",e=>{

    if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a")
        keys.left=false;

    if(e.key==="ArrowRight" || e.key.toLowerCase()==="d")
        keys.right=false;

});


function buttonHold(element,down,up){

    element.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            down();
        }
    );

    element.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            up();
        }
    );

    element.addEventListener(
        "pointercancel",
        up
    );

}


buttonHold(
    document.getElementById("left"),
    ()=>keys.left=true,
    ()=>keys.left=false
);


buttonHold(
    document.getElementById("right"),
    ()=>keys.right=true,
    ()=>keys.right=false
);


document
.getElementById("jump")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        jump();
    }
);


/* =========================
   JUMP
========================= */

function jump(){

    if(
        running &&
        !paused &&
        player.grounded
    ){

        player.vy =
            -player.jumpPower;

        player.grounded=false;

    }

}


/* =========================
   COLLISION
========================= */

function intersects(a,b){

    return (

        a.x < b.x+b.width &&

        a.x+a.width > b.x &&

        a.y < b.y+b.height &&

        a.y+a.height > b.y

    );

}


/* =========================
   UPDATE
========================= */

function update(){

    if(!running || paused)
        return;


    /* الحركة */

    if(keys.left){

        player.vx =
            -player.speed;

    }
    else if(keys.right){

        player.vx =
            player.speed;

    }
    else{

        player.vx *= .82;

    }


    player.x += player.vx;


    /* الجاذبية */

    player.vy += .62;

    player.y += player.vy;


    player.grounded=false;


    /* المنصات */

    for(const p of platforms){

        const previousBottom =
            player.y+
            player.height-
            player.vy;

        const bottom =
            player.y+
            player.height;


        if(

            player.x+player.width>p.x &&

            player.x<p.x+p.width &&

            previousBottom<=p.y &&

            bottom>=p.y &&

            player.vy>=0

        ){

            player.y =
                p.y-player.height;

            player.vy=0;

            player.grounded=true;

        }

    }


    /* الفخاخ */

    for(const trap of traps){

        if(trap.type==="finish")
            continue;


        const hitbox={

            x:trap.x+5,

            y:trap.y,

            width:trap.width-10,

            height:trap.height

        };


        if(intersects(player,hitbox)){

            die();

            return;

        }

    }


    /* العملات */

    for(const coin of collectibles){

        if(coin.taken)
            continue;


        const distanceX =
            player.x+player.width/2-
            coin.x;

        const distanceY =
            player.y+player.height/2-
            coin.y;


        if(
            Math.hypot(
                distanceX,
                distanceY
            )<25
        ){

            coin.taken=true;

            coins++;

            score+=100;

            updateUI();

        }

    }


    /* السقوط */

    if(player.y>H+200){

        die();

        return;

    }


    /* الكاميرا */

    let target =
        player.x-W*.35;


    cameraX +=
        (target-cameraX)*.1;


    cameraX =
        Math.max(
            0,
            Math.min(
                cameraX,
                levelLength-W
            )
        );


    /* النهاية */

    const finishX =
        levelLength-40;


    if(player.x>finishX){

        completeLevel();

    }


    /* سكور الوقت */

    score+=1;

    updateUI();

}


/* =========================
   DIE
========================= */

function die(){

    running=false;

    result.style.display="flex";

    document.getElementById(
        "resultTitle"
    ).textContent="YOU DIED";

    document.getElementById(
        "resultText"
    ).textContent=
        "Score: "+score;

    document.getElementById(
        "nextBtn"
    ).style.display="none";

}


/* =========================
   COMPLETE
========================= */

function completeLevel(){

    running=false;

    score +=
        1000*currentLevel;


    if(currentLevel<5){

        document.getElementById(
            "resultTitle"
        ).textContent=
            "LEVEL COMPLETE!";

        document.getElementById(
            "nextBtn"
        ).style.display="block";

    }else{

        document.getElementById(
            "resultTitle"
        ).textContent=
            "YOU BEAT REDEX JUMP!";

        document.getElementById(
            "nextBtn"
        ).style.display="none";

    }


    document.getElementById(
        "resultText"
    ).textContent=
        "Score: "+score;


    saveBest();

    result.style.display="flex";

}


/* =========================
   NEXT LEVEL
========================= */

document
.getElementById("nextBtn")
.addEventListener("click",()=>{

    if(currentLevel<5){

        currentLevel++;

        startLevel();

    }

});


/* =========================
   RESTART
========================= */

document
.getElementById("restartBtn")
.addEventListener("click",()=>{

    score=0;

    coins=0;

    startLevel();

});


/* =========================
   PAUSE
========================= */

document
.getElementById("pauseBtn")
.addEventListener("click",()=>{

    if(!running)
        return;

    paused=!paused;

    document.getElementById(
        "pauseBtn"
    ).textContent =
        paused ? "▶" : "Ⅱ";

});


/* =========================
   UI
========================= */

function updateUI(){

    scoreUI.textContent =
        Math.floor(score);

    levelUI.textContent =
        currentLevel+" / 5";

    coinsUI.textContent =
        coins;

}


/* =========================
   BEST SCORE
========================= */

function saveBest(){

    const old =
        Number(
            bestUI.textContent
        )||0;


    if(score>old){

        bestUI.textContent =
            Math.floor(score);

    }

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* السماء */

    const gradient =
        ctx.createLinearGradient(
            0,0,
            0,H
        );

    gradient.addColorStop(
        0,
        "#110b1d"
    );

    gradient.addColorStop(
        1,
        "#050509"
    );


    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );


    /* الخلفية */

    ctx.fillStyle="#171021";


    for(let i=0;i<35;i++){

        const x =
            (
                i*170-
                cameraX*.25
            )%
            (W+200);

        const y =
            80+
            (i%7)*65;


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* الجبال */

    ctx.fillStyle="#0d0913";

    for(let i=0;i<8;i++){

        const x =
            i*450-
            cameraX*.12;

        ctx.beginPath();

        ctx.moveTo(
            x,
            H
        );

        ctx.lineTo(
            x+220,
            H-250
        );

        ctx.lineTo(
            x+500,
            H
        );

        ctx.fill();

    }


    /* المنصات */

    for(const p of platforms){

        const x=
            p.x-cameraX;


        if(
            x+p.width<0 ||
            x>W
        )
            continue;


        ctx.fillStyle="#211b29";

        ctx.fillRect(
            x,
            p.y,
            p.width,
            p.height
        );


        ctx.fillStyle="#743c91";

        ctx.fillRect(
            x,
            p.y,
            p.width,
            3
        );

    }


    /* الفخاخ */

    for(const trap of traps){

        const x=
            trap.x-cameraX;


        if(trap.type==="spike"){

            ctx.fillStyle="#dcdcdc";

            const count=4;

            const size=
                trap.width/count;


            for(let i=0;i<count;i++){

                ctx.beginPath();

                ctx.moveTo(
                    x+i*size,
                    trap.y+trap.height
                );

                ctx.lineTo(
                    x+i*size+size/2,
                    trap.y
                );

                ctx.lineTo(
                    x+(i+1)*size,
                    trap.y+trap.height
                );

                ctx.closePath();

                ctx.fill();

            }

        }

        else if(trap.type==="lava"){

            ctx.fillStyle="#8d164f";

            ctx.fillRect(
                x,
                trap.y,
                trap.width,
                trap.height
            );

            ctx.fillStyle="#ff4d91";

            ctx.fillRect(
                x,
                trap.y,
                trap.width,
                3
            );

        }

    }


    /* العملات */

    for(const coin of collectibles){

        if(coin.taken)
            continue;


        const x=
            coin.x-cameraX;


        ctx.fillStyle="#c47aff";

        ctx.beginPath();

        ctx.arc(
            x,
            coin.y,
            coin.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* النهاية */

    const finishX =
        levelLength-cameraX;


    ctx.fillStyle="#c16cff";

    ctx.fillRect(
        finishX,
        H-250,
        5,
        70
    );


    ctx.fillStyle="#a84de0";

    ctx.beginPath();

    ctx.moveTo(
        finishX+5,
        H-250
    );

    ctx.lineTo(
        finishX+55,
        H-230
    );

    ctx.lineTo(
        finishX+5,
        H-210
    );

    ctx.closePath();

    ctx.fill();


    /* اللاعب */

    const px=
        player.x-cameraX;


    /* الجسم */

    ctx.fillStyle="#3b0757";

    ctx.fillRect(
        px,
        player.y,
        player.width,
        player.height
    );


    /* الرأس */

    ctx.beginPath();

    ctx.arc(
        px+player.width/2,
        player.y-8,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* العين */

    ctx.fillStyle="#e6b8ff";

    ctx.fillRect(
        px+19,
        player.y-11,
        3,
        3
    );

}


/* =========================
   GAME LOOP
========================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
