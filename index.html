<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>REDEX JUMP</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050407;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

button{
    font:inherit;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
}

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* =====================================================
   MENU
===================================================== */

#menu{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,#39115b 0%,#160c22 28%,#08060b 70%);
}

.menu-content{
    width:min(560px,92%);
    text-align:center;
}

.logo{
    font-size:clamp(45px,11vw,86px);
    font-weight:1000;
    line-height:.85;
    letter-spacing:8px;
    color:#c477ff;
    text-shadow:
        0 0 12px #a337e8,
        0 0 35px #7a1bb0;
}

.logo span{
    color:#fff;
}

.tagline{
    margin-top:22px;
    color:#a99eaf;
    letter-spacing:4px;
    font-size:13px;
}

.play{
    margin-top:42px;
    width:230px;
    height:68px;
    border:2px solid #c477ff;
    border-radius:20px;
    color:#fff;
    background:linear-gradient(135deg,#70249e,#351046);
    font-size:25px;
    font-weight:900;
    letter-spacing:4px;
    box-shadow:0 0 30px rgba(170,70,230,.35);
    cursor:pointer;
}

.play:active{
    transform:scale(.96);
}

.menu-stats{
    margin:28px auto 0;
    display:flex;
    justify-content:center;
    gap:12px;
}

.menu-card{
    min-width:130px;
    padding:12px 18px;
    border:1px solid #35233f;
    border-radius:14px;
    background:rgba(20,12,27,.65);
}

.menu-card small{
    display:block;
    color:#777;
    font-size:10px;
    letter-spacing:2px;
}

.menu-card strong{
    color:#d38cff;
    font-size:20px;
}

/* =====================================================
   GAME
===================================================== */

#game{
    position:absolute;
    inset:0;
    display:none;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =====================================================
   HUD
===================================================== */

#hud{
    position:absolute;
    top:14px;
    left:14px;
    right:14px;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    pointer-events:none;
}

.hud-box{
    min-width:100px;
    padding:8px 13px;
    border:1px solid rgba(190,100,230,.25);
    border-radius:13px;
    background:rgba(8,6,12,.72);
    backdrop-filter:blur(8px);
}

.hud-box small{
    display:block;
    color:#777;
    font-size:9px;
    letter-spacing:2px;
}

.hud-box strong{
    display:block;
    margin-top:2px;
    color:#d48aff;
    font-size:19px;
}

#pause{
    pointer-events:auto;
    border:1px solid #50305e;
    border-radius:12px;
    background:rgba(10,7,14,.75);
    color:#fff;
    width:45px;
    height:42px;
}

/* =====================================================
   CONTROLS
===================================================== */

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:20px;
    z-index:20;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    padding:
        0
        max(18px,env(safe-area-inset-right))
        max(18px,env(safe-area-inset-bottom))
        max(18px,env(safe-area-inset-left));
    pointer-events:none;
}

.move-controls{
    display:flex;
    gap:12px;
}

.control{
    width:74px;
    height:74px;
    border-radius:21px;
    border:2px solid #673b7b;
    background:rgba(17,10,24,.88);
    color:#fff;
    font-size:28px;
    font-weight:bold;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    pointer-events:auto;
    outline:none;
}

.control:active{
    background:#6e268e;
    border-color:#c77bff;
    transform:scale(.93);
}

.jump{
    width:88px;
    height:88px;
    border-radius:50%;
    background:linear-gradient(145deg,#7f2da5,#401252);
    border-color:#bf6ff0;
    font-size:32px;
}

/* =====================================================
   RESULT
===================================================== */

#result{
    position:absolute;
    inset:0;
    z-index:50;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(3,2,5,.78);
}

.result-card{
    width:min(430px,90%);
    padding:35px;
    text-align:center;
    border:1px solid #74438b;
    border-radius:24px;
    background:#120b18;
    box-shadow:0 20px 80px rgba(0,0,0,.5);
}

.result-card h2{
    color:#d28aff;
    font-size:34px;
}

.result-card p{
    margin-top:12px;
    color:#999;
}

.result-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:25px;
}

.result-buttons button{
    padding:12px 18px;
    border:1px solid #704087;
    border-radius:11px;
    background:#281431;
    color:white;
}

.hidden{
    display:none!important;
}

/* =====================================================
   PORTRAIT MESSAGE
===================================================== */

#rotate{
    display:none;
}

@media(max-width:800px) and (orientation:portrait){

    #rotate{
        position:absolute;
        inset:0;
        z-index:999;
        display:flex;
        align-items:center;
        justify-content:center;
        background:#08060b;
        color:#fff;
        text-align:center;
        font-size:22px;
        font-weight:bold;
        padding:30px;
    }
}

/* =====================================================
   SMALL SCREENS
===================================================== */

@media(max-width:650px){

    .control{
        width:62px;
        height:62px;
        border-radius:18px;
    }

    .jump{
        width:76px;
        height:76px;
    }

    .hud-box{
        min-width:75px;
        padding:7px 9px;
    }

    .hud-box strong{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- ================= MENU ================= -->

    <section id="menu">

        <div class="menu-content">

            <div class="logo">
                REDEX<br><span>JUMP</span>
            </div>

            <div class="tagline">
                RUN • JUMP • SURVIVE
            </div>

            <button class="play" id="playButton">
                PLAY
            </button>

            <div class="menu-stats">

                <div class="menu-card">
                    <small>BEST SCORE</small>
                    <strong id="bestScore">0</strong>
                </div>

                <div class="menu-card">
                    <small>LEVELS</small>
                    <strong>5</strong>
                </div>

            </div>

        </div>

    </section>


    <!-- ================= GAME ================= -->

    <section id="game">

        <canvas id="canvas"></canvas>

        <div id="hud">

            <div class="hud-box">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div class="hud-box">
                <small>LEVEL</small>
                <strong id="level">1 / 5</strong>
            </div>

            <div class="hud-box">
                <small>❤</small>
                <strong id="lives">3</strong>
            </div>

            <button id="pause">Ⅱ</button>

        </div>


        <!-- CONTROLS -->

        <div id="controls">

            <div class="move-controls">

                <button
                    class="control"
                    id="left">
                    ◀
                </button>

                <button
                    class="control"
                    id="right">
                    ▶
                </button>

            </div>

            <button
                class="control jump"
                id="jump">
                ▲
            </button>

        </div>


        <!-- RESULT -->

        <div id="result">

            <div class="result-card">

                <h2 id="resultTitle">
                    LEVEL COMPLETE
                </h2>

                <p id="resultText">
                    Score: 0
                </p>

                <div class="result-buttons">

                    <button id="next">
                        NEXT LEVEL
                    </button>

                    <button id="restart">
                        RESTART
                    </button>

                </div>

            </div>

        </div>

    </section>


    <div id="rotate">
        📱<br><br>
        اقلب الهاتف بالعرض<br>
        للعب REDEX JUMP
    </div>

</div>


<script>
/* =====================================================
   REDEX JUMP ENGINE
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const game = document.getElementById("game");

const playButton = document.getElementById("playButton");
const result = document.getElementById("result");

const scoreUI = document.getElementById("score");
const levelUI = document.getElementById("level");
const livesUI = document.getElementById("lives");
const bestScoreUI = document.getElementById("bestScore");

const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");

let W = 0;
let H = 0;

let level = 1;
let score = 0;
let lives = 3;

let cameraX = 0;

let running = false;
let paused = false;

let platforms = [];
let spikes = [];
let movingTraps = [];
let coins = [];
let particles = [];

let finishX = 0;

let checkpoint = {
    x:100,
    y:100
};

const input = {
    left:false,
    right:false
};

const player = {

    x:100,
    y:100,

    w:30,
    h:47,

    vx:0,
    vy:0,

    maxSpeed:6,
    acceleration:.75,
    friction:.78,

    jump:-13.2,

    grounded:false,

    coyote:0,

    jumpBuffer:0,

    facing:1

};


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

}

window.addEventListener("resize",resize);

resize();


/* =====================================================
   START
===================================================== */

playButton.addEventListener("click",startGame);

function startGame(){

    menu.style.display="none";
    game.style.display="block";

    level=1;
    score=0;
    lives=3;

    startLevel();

}


/* =====================================================
   LEVEL SETTINGS
===================================================== */

const difficulty = {

    1:{
        length:4200,
        platforms:23,
        gap:150,
        trap:.15,
        moving:.03
    },

    2:{
        length:4800,
        platforms:27,
        gap:165,
        trap:.23,
        moving:.07
    },

    3:{
        length:5500,
        platforms:32,
        gap:180,
        trap:.32,
        moving:.12
    },

    4:{
        length:6300,
        platforms:37,
        gap:195,
        trap:.42,
        moving:.17
    },

    5:{
        length:7300,
        platforms:44,
        gap:205,
        trap:.52,
        moving:.23
    }

};


/* =====================================================
   LEVEL GENERATION
===================================================== */

function startLevel(){

    running=true;
    paused=false;

    cameraX=0;

    platforms=[];
    spikes=[];
    movingTraps=[];
    coins=[];
    particles=[];

    player.x=100;
    player.y=H-250;

    player.vx=0;
    player.vy=0;

    player.grounded=false;

    checkpoint.x=100;
    checkpoint.y=H-250;

    createLevel();

    updateUI();

}


function createLevel(){

    const d=difficulty[level];

    const ground=H-85;

    /* بداية */

    platforms.push({
        x:0,
        y:ground,
        w:480,
        h:100
    });


    let x=540;
    let y=ground-70;


    for(let i=0;i<d.platforms;i++){

        const width=
            Math.max(
                85,
                180-level*11-Math.random()*35
            );


        const jumpChange =
            (Math.random()-.5)*
            (80+level*18);


        y+=jumpChange;

        y=Math.max(
            H-390,
            Math.min(
                H-105,
                y
            )
        );


        platforms.push({
            x:x,
            y:y,
            w:width,
            h:25
        });


        /* فخاخ ثابتة */

        if(
            i>2 &&
            Math.random()<d.trap
        ){

            const trapWidth=
                25+
                Math.random()*30;


            spikes.push({

                x:
                    x+
                    Math.random()*
                    Math.max(
                        5,
                        width-trapWidth
                    ),

                y:y-22,

                w:trapWidth,

                h:22

            });

        }


        /* فخ متحرك */

        if(
            i>5 &&
            Math.random()<d.moving
        ){

            movingTraps.push({

                x:
                    x+
                    width/2,

                baseY:
                    y-50,

                y:
                    y-50,

                w:35,

                h:35,

                speed:
                    .018+
                    Math.random()*.012,

                range:
                    35+
                    level*12,

                time:
                    Math.random()*10

            });

        }


        /* عملة */

        if(Math.random()<.72){

            coins.push({

                x:
                    x+
                    width/2,

                y:
                    y-45,

                r:8,

                collected:false

            });

        }


        /* Checkpoint */

        if(
            i>4 &&
            i%7===0
        ){

            checkpoint={
                x:x+width/2,
                y:y-100
            };

        }


        x +=
            width+
            d.gap+
            Math.random()*70;

    }


    /* منصة النهاية */

    platforms.push({

        x:x,
        y:H-180,
        w:400,
        h:30

    });


    finishX=x+320;

}


/* =====================================================
   INPUT
===================================================== */

window.addEventListener("keydown",e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){

        input.left=true;
        player.facing=-1;

    }


    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){

        input.right=true;
        player.facing=1;

    }


    if(
        e.key===" " ||
        e.key==="ArrowUp" ||
        e.key.toLowerCase()==="w"
    ){

        queueJump();

        e.preventDefault();

    }

});


window.addEventListener("keyup",e=>{

    if(
        e.key==="ArrowLeft" ||
        e.key.toLowerCase()==="a"
    ){

        input.left=false;

    }


    if(
        e.key==="ArrowRight" ||
        e.key.toLowerCase()==="d"
    ){

        input.right=false;

    }

});


/* =====================================================
   MOBILE BUTTONS
===================================================== */

function hold(button,down,up){

    button.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            down();
        }
    );

    button.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            up();
        }
    );

    button.addEventListener(
        "pointercancel",
        up
    );

    button.addEventListener(
        "pointerleave",
        up
    );

}


hold(
    document.getElementById("left"),
    ()=>{
        input.left=true;
        player.facing=-1;
    },
    ()=>{
        input.left=false;
    }
);


hold(
    document.getElementById("right"),
    ()=>{
        input.right=true;
        player.facing=1;
    },
    ()=>{
        input.right=false;
    }
);


document
.getElementById("jump")
.addEventListener(
    "pointerdown",
    e=>{
        e.preventDefault();
        queueJump();
    }
);


/* =====================================================
   JUMP BUFFER
===================================================== */

function queueJump(){

    player.jumpBuffer=9;

}


/* =====================================================
   COLLISION
===================================================== */

function hit(a,b){

    return(
        a.x < b.x+b.w &&
        a.x+a.w > b.x &&
        a.y < b.y+b.h &&
        a.y+a.h > b.y
    );

}


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!running || paused)
        return;


    /* Jump buffer */

    if(player.jumpBuffer>0)
        player.jumpBuffer--;


    /* الحركة */

    if(input.left){

        player.vx -=
            player.acceleration;

    }


    if(input.right){

        player.vx +=
            player.acceleration;

    }


    if(
        !input.left &&
        !input.right
    ){

        player.vx *=
            player.friction;

    }


    player.vx=
        Math.max(
            -player.maxSpeed,
            Math.min(
                player.maxSpeed,
                player.vx
            )
        );


    player.x+=player.vx;


    /* الجاذبية */

    player.vy+=.65;

    player.y+=player.vy;


    player.grounded=false;


    /* Collision platforms */

    for(const p of platforms){

        const oldBottom=
            player.y+
            player.h-
            player.vy;

        const bottom=
            player.y+
            player.h;


        if(

            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            oldBottom<=p.y &&
            bottom>=p.y &&
            player.vy>=0

        ){

            player.y=
                p.y-player.h;

            player.vy=0;

            player.grounded=true;

            player.coyote=7;

        }

    }


    if(!player.grounded){

        if(player.coyote>0)
            player.coyote--;

    }


    /* Jump */

    if(
        player.jumpBuffer>0 &&
        (
            player.grounded ||
            player.coyote>0
        )
    ){

        player.vy=
            player.jump;

        player.grounded=false;

        player.jumpBuffer=0;

        spawnParticles(
            player.x+player.w/2,
            player.y+player.h,
            8
        );

    }


    /* Spikes */

    for(const s of spikes){

        if(hit(player,s)){

            damage();

            return;

        }

    }


    /* Moving traps */

    for(const t of movingTraps){

        t.time+=t.speed;

        t.y=
            t.baseY+
            Math.sin(t.time)*
            t.range;


        if(hit(player,t)){

            damage();

            return;

        }

    }


    /* Coins */

    for(const c of coins){

        if(c.collected)
            continue;


        const dx=
            player.x+
            player.w/2-
            c.x;

        const dy=
            player.y+
            player.h/2-
            c.y;


        if(
            Math.sqrt(
                dx*dx+
                dy*dy
            )<28
        ){

            c.collected=true;

            score+=150;

            spawnParticles(
                c.x,
                c.y,
                14
            );

        }

    }


    /* Camera */

    const target=
        player.x-
        W*.35;


    cameraX +=
        (target-cameraX)*
        .1;


    cameraX=
        Math.max(
            0,
            Math.min(
                cameraX,
                difficulty[level].length-W
            )
        );


    /* Finish */

    if(player.x>finishX){

        completeLevel();

        return;

    }


    /* Fall */

    if(player.y>H+300){

        damage();

        return;

    }


    /* Distance score */

    score+=
        Math.max(
            0,
            Math.floor(
                Math.abs(player.vx)*.05
            )
        );


    updateParticles();

    updateUI();

}


/* =====================================================
   DAMAGE
===================================================== */

function damage(){

    lives--;

    spawnParticles(
        player.x,
        player.y,
        25
    );


    if(lives<=0){

        running=false;

        showResult(
            "GAME OVER",
            "Final Score: "+Math.floor(score),
            false
        );

        saveBest();

        return;

    }


    /* رجوع للـ checkpoint */

    player.x=
        checkpoint.x;

    player.y=
        checkpoint.y;

    player.vx=0;
    player.vy=0;

    cameraX=
        Math.max(
            0,
            player.x-W*.35
        );

    updateUI();

}


/* =====================================================
   COMPLETE
===================================================== */

function completeLevel(){

    running=false;

    score+=
        1000*level;


    saveBest();


    if(level<5){

        showResult(
            "LEVEL "+level+" COMPLETE",
            "Score: "+Math.floor(score),
            true
        );

    }
    else{

        showResult(
            "REDEX MASTER!",
            "Final Score: "+Math.floor(score),
            false
        );

    }

}


function showResult(title,text,next){

    resultTitle.textContent=title;

    resultText.textContent=text;

    result.style.display="flex";

    document
        .getElementById("next")
        .classList.toggle(
            "hidden",
            !next
        );

}


/* =====================================================
   RESULT BUTTONS
===================================================== */

document
.getElementById("next")
.addEventListener("click",()=>{

    result.style.display="none";

    level++;

    startLevel();

});


document
.getElementById("restart")
.addEventListener("click",()=>{

    result.style.display="none";

    lives=3;

    score=0;

    level=1;

    startLevel();

});


/* =====================================================
   PAUSE
===================================================== */

document
.getElementById("pause")
.addEventListener("click",()=>{

    if(!running)
        return;

    paused=!paused;

    document.getElementById("pause")
        .textContent=
        paused ? "▶" : "Ⅱ";

});


/* =====================================================
   PARTICLES
===================================================== */

function spawnParticles(x,y,count){

    for(let i=0;i<count;i++){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:
                25+
                Math.random()*20,

            size:
                2+
                Math.random()*4

        });

    }

}


function updateParticles(){

    for(const p of particles){

        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.08;

        p.life--;

    }


    particles=
        particles.filter(
            p=>p.life>0
        );

}


/* =====================================================
   DRAW BACKGROUND
===================================================== */

function drawBackground(){

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#12091c"
    );

    gradient.addColorStop(
        .55,
        "#090711"
    );

    gradient.addColorStop(
        1,
        "#040306"
    );


    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* Moon */

    ctx.fillStyle=
        "rgba(197,119,255,.10)";

    ctx.beginPath();

    ctx.arc(
        W*.75,
        H*.22,
        75,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Stars */

    for(let i=0;i<45;i++){

        const x=
            (
                i*197-
                cameraX*.12
            )%
            (W+220);

        const y=
            40+
            (i*83)%(
                Math.max(
                    100,
                    H*.6
                )
            );


        ctx.fillStyle=
            "rgba(220,180,255,.45)";

        ctx.fillRect(
            x,
            y,
            2,
            2
        );

    }


    /* Far mountains */

    ctx.fillStyle="#0d0813";

    for(let i=0;i<10;i++){

        const x=
            i*450-
            cameraX*.18;


        ctx.beginPath();

        ctx.moveTo(
            x,
            H
        );

        ctx.lineTo(
            x+210,
            H-230
        );

        ctx.lineTo(
            x+460,
            H
        );

        ctx.closePath();

        ctx.fill();

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    drawBackground();


    /* Platforms */

    for(const p of platforms){

        const x=
            p.x-cameraX;


        if(
            x+p.w<0 ||
            x>W
        )
            continue;


        /* shadow */

        ctx.fillStyle=
            "rgba(0,0,0,.4)";

        ctx.fillRect(
            x+4,
            p.y+7,
            p.w,
            p.h
        );


        ctx.fillStyle="#211729";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            p.h
        );


        ctx.fillStyle="#8849a5";

        ctx.fillRect(
            x,
            p.y,
            p.w,
            3
        );

    }


    /* Spikes */

    for(const s of spikes){

        const x=
            s.x-cameraX;


        ctx.fillStyle="#ded7e2";


        const count=
            Math.max(
                2,
                Math.floor(s.w/10)
            );


        const sw=
            s.w/count;


        for(let i=0;i<count;i++){

            ctx.beginPath();

            ctx.moveTo(
                x+i*sw,
                s.y+s.h
            );

            ctx.lineTo(
                x+i*sw+sw/2,
                s.y
            );

            ctx.lineTo(
                x+(i+1)*sw,
                s.y+s.h
            );

            ctx.closePath();

            ctx.fill();

        }

    }


    /* Moving traps */

    for(const t of movingTraps){

        const x=
            t.x-cameraX;


        ctx.fillStyle="#b21f63";

        ctx.beginPath();

        ctx.arc(
            x+t.w/2,
            t.y+t.h/2,
            t.w/2,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.strokeStyle="#ff6aa8";

        ctx.lineWidth=2;

        ctx.stroke();

    }


    /* Coins */

    for(const c of coins){

        if(c.collected)
            continue;


        const x=
            c.x-cameraX;


        ctx.fillStyle="#c878ff";

        ctx.beginPath();

        ctx.arc(
            x,
            c.y,
            c.r,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle="#f1d5ff";

        ctx.beginPath();

        ctx.arc(
            x-2,
            c.y-2,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* Finish */

    const fx=
        finishX-cameraX;


    ctx.fillStyle="#bd66f0";

    ctx.fillRect(
        fx,
        H-250,
        6,
        70
    );


    ctx.fillStyle="#d997ff";

    ctx.beginPath();

    ctx.moveTo(
        fx+6,
        H-250
    );

    ctx.lineTo(
        fx+62,
        H-226
    );

    ctx.lineTo(
        fx+6,
        H-202
    );

    ctx.closePath();

    ctx.fill();


    /* Player */

    const px=
        player.x-cameraX;


    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
        px+player.w/2,
        player.y+player.h+4,
        19,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* body */

    ctx.fillStyle="#3a0754";

    ctx.fillRect(
        px,
        player.y,
        player.w,
        player.h
    );


    /* head */

    ctx.beginPath();

    ctx.arc(
        px+player.w/2,
        player.y-8,
        12,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eye */

    ctx.fillStyle="#e8baff";

    const eyeX=
        player.facing===1
        ?px+21
        :px+6;


    ctx.fillRect(
        eyeX,
        player.y-11,
        3,
        3
    );


    /* particles */

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life/40
            );

        ctx.fillStyle="#c56cff";

        ctx.fillRect(
            p.x-cameraX,
            p.y,
            p.size,
            p.size
        );

    }

    ctx.globalAlpha=1;

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    scoreUI.textContent=
        Math.floor(score);

    levelUI.textContent=
        level+" / 5";

    livesUI.textContent=
        lives;

}


function saveBest(){

    const current=
        Number(
            bestScoreUI.textContent
        )||0;


    if(score>current){

        bestScoreUI.textContent=
            Math.floor(score);

    }

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}

loop();

</script>
